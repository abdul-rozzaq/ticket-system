name: release-extension

# Publish: git tag v0.2.0 && git push origin v0.2.0
# Builds the Chrome extension and attaches tp-assistant-v0.2.0.zip to a GitHub Release.
# Install from the zip: unzip, chrome://extensions -> Developer mode -> Load unpacked -> choose the unzipped folder.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag looks like v1.2.3
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3, got ${GITHUB_REF_NAME}"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tp/shared build
      - run: pnpm --filter @tp/extension test
      - run: pnpm --filter @tp/extension build

      - name: Stamp the version from the tag into the built manifest
        working-directory: apps/extension
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const f = 'dist/manifest.json';
            const m = JSON.parse(fs.readFileSync(f, 'utf8'));
            m.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(m, null, 2) + '\n');
          " "$VERSION"
          grep '"version"' dist/manifest.json

      - name: Zip
        working-directory: apps/extension
        run: |
          ZIP="tp-assistant-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r -q "../$ZIP" .)
          ls -l "$ZIP"
          echo "ZIP=apps/extension/$ZIP" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "TP Assistant $GITHUB_REF_NAME" \
            --generate-notes
