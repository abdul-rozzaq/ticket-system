packages:
  - apps/*
  - packages/*
# pnpm 12 does not run dependency build scripts unless they are allowed here (`onlyBuiltDependencies` is ignored,
# a clean `pnpm install --frozen-lockfile` fails with ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  sharp: true
  # explicitly denied: telemetry / optional native speed-ups (ws falls back to plain JS without them)
  '@scarf/scarf': false
  bufferutil: false
  utf-8-validate: false
  es5-ext: false
