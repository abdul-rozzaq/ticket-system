<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fake Telegram WebK (TP harness)</title>
<style>
  body { margin: 0; font: 14px sans-serif; display: flex; height: 100vh; background: #fff; }
  #column-left { width: 300px; border-right: 1px solid #ddd; overflow: auto; }
  .chatlist-chat { display: block; padding: 10px; border-bottom: 1px solid #eee; color: inherit; text-decoration: none; }
  .dialog-title { display: flex; align-items: center; }
  #column-center { flex: 1; display: flex; flex-direction: column; }
  .chat.active { display: flex; flex-direction: column; height: 100%; }
  .topbar { padding: 10px; border-bottom: 1px solid #ddd; }
  .bubbles { flex: 1; overflow: auto; background: #e7ebf0; }
  .bubble { margin: 8px; max-width: 60%; padding: 6px 10px; border-radius: 10px; background: #fff; }
  .bubble.is-out { margin-left: auto; background: #effdde; }
  .reply { border-left: 2px solid #3390ec; padding-left: 6px; color: #666; font-size: 12px; }
  .time { color: #999; font-size: 11px; margin-left: 6px; }
  .chat-input-container { padding: 10px; border-top: 1px solid #ddd; }
  .input-message-input { min-height: 36px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; white-space: pre-wrap; }
  .input-field-input-fake { display: none; }
</style>
<script src="/harness/chrome-stub.js"></script>
</head>
<body>
<div id="column-left"><div id="chatlist-container"><ul class="chatlist">
  <a class="chatlist-chat row" data-peer-id="-1001234567890" href="#-1001234567890"><div class="dialog-title"><span class="peer-title">Orient Motors support</span></div></a>
  <a class="chatlist-chat row" data-peer-id="-1005550001" href="#-1005550001"><div class="dialog-title"><span class="peer-title">Samarqand Textile IT</span></div></a>
  <a class="chatlist-chat row" data-peer-id="-1005550002" href="#-1005550002"><div class="dialog-title"><span class="peer-title">Baraka Logistics</span></div></a>
  <a class="chatlist-chat row" data-peer-id="777000" href="#777000"><div class="dialog-title"><span class="peer-title">Telegram</span></div></a>
</ul></div></div>
<div id="column-center"><div class="chat active">
  <div class="sidebar-header topbar"><div class="chat-info"><div class="top"><span class="peer-title" id="title">Orient Motors support</span></div><div class="bottom">12 members</div></div></div>
  <div class="bubbles"><div class="scrollable"><div class="bubbles-inner">
    <div class="bubble is-in" data-mid="101"><div class="bubble-content"><div class="name"><span class="peer-title">Jasur</span></div>
      <div class="message"><span class="translatable-message">Assalomu alaykum, webhook ulanmadi, lidlar AmoCRMga tushmayapti</span><span class="time"><span class="time-inner">10:01</span></span></div></div></div>
    <div class="bubble is-in" data-mid="102"><div class="bubble-content">
      <div class="message"><div class="reply"><div class="reply-subtitle">webhook ulanmadi</div></div><span class="translatable-message">login admin parol: Qwerty123 , tel +998 90 123 45 67</span><span class="time"><span class="time-inner">10:02</span></span></div></div></div>
    <div class="bubble is-out" data-mid="103"><div class="bubble-content"><div class="message"><span class="translatable-message">Tekshiryapmiz</span><span class="time"><span class="time-inner">10:03</span></span></div></div></div>
  </div></div></div>
  <div class="chat-input-container"><div class="input-message-container">
    <div class="input-message-input" contenteditable="true" id="composer"></div>
    <div class="input-message-input input-field-input-fake" contenteditable="true"></div>
  </div></div>
</div></div>
<script>
  // Fake "send on Enter" so the harness can prove the extension never sends.
  window.__sent = [];
  document.getElementById('composer').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.__sent.push(e.target.innerText); e.target.innerHTML = ''; }
  });
  // Switching chats via the list updates the title, like the real app.
  addEventListener('hashchange', () => {
    const a = document.querySelector(`.chatlist-chat[href="${location.hash}"] .peer-title`);
    document.getElementById('title').textContent = a ? a.textContent : location.hash;
  });
</script>
<script src="/dist/content.js"></script>
</body>
</html>
