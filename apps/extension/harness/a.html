<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8" />
<title>Fake Telegram WebA (TP harness)</title>
<style>
  body { margin: 0; font: 14px sans-serif; display: flex; height: 100vh; background: #181818; color: #eee; }
  #LeftColumn { width: 300px; border-right: 1px solid #333; }
  .ListItem-button { display: block; padding: 10px; color: inherit; text-decoration: none; border-bottom: 1px solid #2a2a2a; }
  #MiddleColumn { flex: 1; display: flex; flex-direction: column; }
  .MiddleHeader { padding: 10px; border-bottom: 1px solid #333; }
  .MessageList { flex: 1; overflow: auto; }
  .Message { margin: 8px; max-width: 60%; padding: 6px 10px; border-radius: 10px; background: #2b2b2b; }
  .Message.own { margin-left: auto; background: #3e3366; }
  .message-time { color: #999; font-size: 11px; margin-left: 6px; }
  .Composer { padding: 10px; border-top: 1px solid #333; }
  #editable-message-text { min-height: 36px; border: 1px solid #444; border-radius: 8px; padding: 8px; white-space: pre-wrap; }
</style>
<script src="/harness/chrome-stub.js"></script>
</head>
<body>
<div id="LeftColumn"><div class="chat-list">
  <div class="ListItem Chat"><a class="ListItem-button" href="#-1009876543210"><div class="info"><div class="title"><h3 class="fullName">Silk Road Call</h3></div></div></a></div>
  <div class="ListItem Chat"><a class="ListItem-button" href="#-1003330001"><div class="info"><div class="title"><h3 class="fullName">Toshkent Med Servis</h3></div></div></a></div>
</div></div>
<div id="MiddleColumn">
  <div class="MiddleHeader"><div class="ChatInfo"><div class="info"><div class="title"><h3 class="fullName" id="title">Silk Road Call</h3></div><span class="status">3 members</span></div></div></div>
  <div class="MessageList">
    <div class="Message message-list-item" data-message-id="55" id="message-55"><div class="message-content"><div class="message-title"><span class="sender-title">Marina</span></div>
      <div class="text-content">Здравствуйте, нет записей звонков в АТС<span class="MessageMeta"><span class="message-time">09:15</span></span></div></div></div>
    <div class="Message message-list-item own" data-message-id="56"><div class="message-content"><div class="text-content">Проверяем<span class="MessageMeta"><span class="message-time">09:16</span></span></div></div></div>
  </div>
  <div class="Composer"><div class="message-input-wrapper"><div id="editable-message-text" contenteditable="true"></div></div></div>
</div>
<script>
  window.__sent = [];
  document.getElementById('editable-message-text').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.__sent.push(e.target.innerText); e.target.innerHTML = ''; }
  });
</script>
<script src="/dist/content.js"></script>
</body>
</html>
