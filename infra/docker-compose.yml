# TP Ticket System. `docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build`
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tp}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32 bytes base64)}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEMO_MODE: ${DEMO_MODE:-false}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN (16+ chars)}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  userbot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.userbot
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN (16+ chars)}
      # Get these at https://my.telegram.org -> API development tools
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      USERBOT_FAKE: ${USERBOT_FAKE:-false}

  bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.bot
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN (16+ chars)}
      # The bot token itself is set by an admin (PUT /api/v1/telegram/bot) and stored encrypted by the API.
      BOT_MODE: ${BOT_MODE:-polling}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      BOT_FAKE: ${BOT_FAKE:-false}

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      # true when the panel is served over HTTPS (Secure session cookies)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${ADMIN_PORT:-3001}:3001'

volumes:
  pgdata:
  redisdata:
